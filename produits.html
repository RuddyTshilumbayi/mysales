<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>MYSALES - Produits</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="header">
      <div class="logo">MYSALES</div>

      <nav>
        <a href="index.html">Accueil</a>

        <a href="clients.html">Clients</a>

        <a href="produits.html">Produits</a>

        <a href="ventes.html">Ventes</a>

        <a href="dashboard.html">Dashboard</a>
      </nav>

      <!-- Utilisateur connecté -->
      <div class="user-menu">
        <div class="user-info">
          <strong id="nomUtilisateur">Chargement...</strong>

          <span id="roleUtilisateur"></span>
        </div>

        <button type="button" id="boutonDeconnexion">Déconnexion</button>
      </div>
    </header>

    <main>
      <!-- ========================================= -->
      <!-- TITRE -->
      <!-- ========================================= -->

      <section class="page-header">
        <h2>Gestion des produits</h2>

        <p>Ajoutez, recherchez, modifiez et supprimez vos produits.</p>
      </section>

      <!-- ========================================= -->
      <!-- FORMULAIRE -->
      <!-- ========================================= -->

      <section class="form-section">
        <h3 id="titreFormulaireProduit">Ajouter un produit</h3>

        <form id="produitForm">
          <div>
            <label for="nomProduit">Nom du produit</label>

            <input
              type="text"
              id="nomProduit"
              placeholder="Ex : Ordinateur Dell"
              required
            />
          </div>

          <div>
            <label for="descriptionProduit">Description</label>

            <input
              type="text"
              id="descriptionProduit"
              placeholder="Ex : Ordinateur portable"
            />
          </div>

          <div>
            <label for="prixProduit">Prix</label>

            <input
              type="number"
              id="prixProduit"
              placeholder="Ex : 850"
              min="0"
              step="0.01"
              required
            />
          </div>

          <div>
            <label for="stockProduit">Stock</label>

            <input
              type="number"
              id="stockProduit"
              placeholder="Ex : 10"
              min="0"
              step="1"
              required
            />
          </div>

          <button type="submit" id="boutonProduit">
            Enregistrer le produit
          </button>

          <button type="button" id="boutonAnnuler" style="display: none">
            Annuler la modification
          </button>
        </form>
      </section>

      <!-- ========================================= -->
      <!-- RECHERCHE -->
      <!-- ========================================= -->

      <section class="form-section">
        <h3>Rechercher un produit</h3>

        <input
          type="text"
          id="rechercheProduit"
          placeholder="Nom ou description du produit..."
        />
      </section>

      <!-- ========================================= -->
      <!-- LISTE DES PRODUITS -->
      <!-- ========================================= -->

      <section class="table-section">
        <h3>Liste des produits</h3>

        <table>
          <thead>
            <tr>
              <th>ID</th>

              <th>Nom</th>

              <th>Description</th>

              <th>Prix</th>

              <th>Stock</th>

              <th>Actions</th>
            </tr>
          </thead>

          <tbody id="produitsList">
            <tr>
              <td colspan="6">Chargement...</td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>

    <script src="produits.js"></script>

    <script src="auth.js"></script>
  </body>
</html>
