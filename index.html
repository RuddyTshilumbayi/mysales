<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>MySales - Gestion des ventes</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- En-tête -->
    <header class="header">
      <div class="logo">MySales</div>

      <nav>
        <a href="#">Accueil</a>
        <a href="#">Clients</a>
        <a href="#">Produits</a>
        <a href="#">Ventes</a>
        <a href="#">Dashboard</a>
      </nav>
    </header>

    <!-- Contenu principal -->
    <main>
      <section class="hero">
        <div>
          <h1>
            Gérez vos ventes
            <span>simplement.</span>
          </h1>

          <p>
            MySales vous permet de gérer vos clients, vos produits et vos ventes
            depuis une seule application.
          </p>

          <button onclick="commencer()">Commencer</button>
        </div>
      </section>

      <!-- Statistiques -->
      <section class="stats">
        <div class="card">
          <h2>0</h2>
          <p>Clients</p>
        </div>

        <div class="card">
          <h2>0</h2>
          <p>Produits</p>
        </div>

        <div class="card">
          <h2>0 FC</h2>
          <p>Chiffre d'affaires</p>
        </div>

        <div class="card">
          <h2>0</h2>
          <p>Ventes</p>
        </div>
      </section>
    </main>

    <!-- Pied de page -->
    <footer>
      <p>© 2026 MySales - Application de gestion des ventes</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
