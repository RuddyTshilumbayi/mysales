<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion - MYSALES</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <h1>MYSALES</h1>

            <p class="login-subtitle">
                Gestion des ventes
            </p>

            <h2>Connexion</h2>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">
                        Adresse e-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="admin@mysales.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="motDePasse">
                        Mot de passe
                    </label>

                    <input
                        type="password"
                        id="motDePasse"
                        name="motDePasse"
                        placeholder="Votre mot de passe"
                        required
                    >
                </div>

                <button type="submit" id="boutonConnexion">
                    Se connecter
                </button>

                <p id="messageConnexion"></p>

            </form>

        </div>

    </div>

    <script src="login.js"></script>

</body>
</html>
