<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>MySales - Clients</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="header">
      <div class="logo">MySales</div>

      <nav>
        <a href="index.html">Accueil</a>

        <a href="clients.html">Clients</a>

        <a href="#">Produits</a>

        <a href="#">Ventes</a>

        <a href="#">Dashboard</a>
      </nav>
    </header>

    <main>
      <section class="hero">
        <div>
          <h1>Gestion des <span>clients</span></h1>

          <p>Consultez et gérez les clients de votre entreprise.</p>

          <form id="clientForm">

    <div class="form-group">
        <label for="nom">Nom complet</label>
        <input type="text" id="nom" placeholder="Ex : Jean Mukendi" required>
    </div>

    <div class="form-group">
        <label for="telephone">Téléphone</label>
        <input type="tel" id="telephone" placeholder="Ex : 0812345678" required>
    </div>

    <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Ex : jean@email.com">
    </div>

    <div class="form-group">
        <label for="ville">Ville</label>
        <input type="text" id="ville" placeholder="Ex : Kinshasa" required>
    </div>

    <button type="submit">
        Enregistrer le client
    </button>

</form></button>
        </div>
      </section>

      <section class="clients-section">

    <h2>Liste des clients</h2>

    <table id="clientsTable">

        <thead>

            <tr>
                <th>Nom</th>
                <th>Téléphone</th>
                <th>Email</th>
                <th>Ville</th>
            </tr>

        </thead>

        <tbody id="clientsList">

        </tbody>

    </table>

</section>
    </main>

    <footer>
      <p>© 2026 MySales - Application de gestion des ventes</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
