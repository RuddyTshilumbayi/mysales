<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>MYSALES - Clients</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1>MYSALES</h1>

      <nav>
        <a href="index.html"> Accueil </a>

        <a href="clients.html"> Clients </a>

        <a href="produits.html"> Produits </a>

        <a href="ventes.html"> Ventes </a>

        <a href="dashboard.html"> Dashboard </a>
      </nav>
    </header>

    <main>
      <section class="page-header">
        <h2>Gestion des clients</h2>

        <p>Ajoutez, recherchez, modifiez et supprimez vos clients.</p>
      </section>

      <!-- =========================
             FORMULAIRE
        ========================== -->

      <section class="form-section">
        <h3>Ajouter un client</h3>

        <form id="clientForm">
          <div>
            <label for="nomComplet"> Nom complet </label>

            <input type="text" id="nomComplet" required />
          </div>

          <div>
            <label for="telephone"> Téléphone </label>

            <input type="text" id="telephone" required />
          </div>

          <div>
            <label for="email"> Email </label>

            <input type="email" id="email" />
          </div>

          <div>
            <label for="ville"> Ville </label>

            <input type="text" id="ville" />
          </div>

          <button type="submit">Enregistrer le client</button>
        </form>
      </section>

      <!-- =========================
             RECHERCHE
        ========================== -->

      <section class="form-section">
        <h3>Rechercher un client</h3>

        <input
          type="text"
          id="rechercheClient"
          placeholder="Nom, téléphone ou ville..."
        />
      </section>

      <!-- =========================
             TABLEAU CLIENTS
        ========================== -->

      <section class="table-section">
        <h3>Liste des clients</h3>

        <table>
          <thead>
            <tr>
              <th>ID</th>

              <th>Nom complet</th>

              <th>Téléphone</th>

              <th>Email</th>

              <th>Ville</th>

              <th>Actions</th>
            </tr>
          </thead>

          <tbody id="clientsList">
            <tr>
              <td colspan="6">Chargement...</td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
